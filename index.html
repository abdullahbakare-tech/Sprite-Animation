<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite Animations</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas1"></canvas>
    <div class="controls">
      <label for="animations" name="animaitons">Choose Animations:</label>
      <select id="animations" name="animations">
        <option value="forwardWalk">Front Walk</option>
        <option value="sideWalk">Side Walk</option>
        <option value="backWalk">Back Walk</option>
        <option value="sideFrontWalk">Side Walk Front</option>
        <option value="forward2Walk">Return Walk Front</option>
        <option value="side2Walk">Side Walk 2</option>
        <option value="rest">Rest</option>
        <option value="atRest">Sleeping</option>
        <option value="run">Run</option>
      </select>
    </div>
    <!-- The canvas tag in HTML is used to create a drawable area in a webpage
    where JavaScript can render graphics. The tag itself is just a blank bitmap,
    but JavaScript gives you full control to draw shapes, images, animations,
    and even game graphics. -->

    <script src="script.js"></script>
  </body>
</html>
